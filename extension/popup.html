<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GeM-Intel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { width: 340px; background: #0f172a; color: #f8fafc; padding: 16px; }
    .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #334155; padding-bottom: 12px; margin-bottom: 14px; }
    .logo { font-weight: 700; font-size: 15px; color: #60a5fa; display: flex; align-items: center; gap: 6px; }
    .badge { font-size: 10px; background: #1e293b; color: #94a3b8; padding: 2px 6px; border-radius: 4px; border: 1px solid #475569; }

    /* Auth States */
    .auth-section { margin-bottom: 14px; }
    .form-group { margin-bottom: 10px; }
    label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 3px; text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; }
    input { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 12px; }
    input:focus { outline: none; border-color: #3b82f6; }

    .btn-primary { width: 100%; background: #2563eb; color: #fff; border: none; padding: 10px; border-radius: 6px; font-weight: 600; font-size: 13px; cursor: pointer; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { width: 100%; background: transparent; color: #94a3b8; border: 1px solid #334155; padding: 8px; border-radius: 6px; font-size: 11px; cursor: pointer; margin-top: 8px; }
    .btn-secondary:hover { background: #1e293b; color: #fff; }
    .btn-danger { background: #7f1d1d; color: #fca5a5; border: 1px solid #991b1b; }
    .btn-danger:hover { background: #991b1b; }

    .user-info { background: #1e293b; border-radius: 8px; padding: 12px; border: 1px solid #334155; margin-bottom: 12px; }
    .user-name { font-size: 14px; font-weight: 600; color: #f8fafc; }
    .user-email { font-size: 11px; color: #94a3b8; }
    .user-role { display: inline-block; font-size: 10px; background: #2563eb22; color: #60a5fa; padding: 2px 8px; border-radius: 4px; margin-top: 4px; font-weight: 600; text-transform: uppercase; }

    .status-msg { font-size: 11px; padding: 6px 10px; border-radius: 4px; margin-bottom: 10px; display: none; }
    .status-success { display: block; background: #065f4622; color: #6ee7b7; border: 1px solid #065f46; }
    .status-error { display: block; background: #7f1d1d22; color: #fca5a5; border: 1px solid #7f1d1d; }

    .tip { font-size: 11px; color: #64748b; text-align: center; margin-top: 12px; line-height: 1.5; }
    .tip strong { color: #94a3b8; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🏛️ GeM-Intel</div>
    <div class="badge">GFR 149</div>
  </div>

  <div id="statusMsg" class="status-msg"></div>

  <!-- Login View -->
  <div id="loginView" style="display:none;">
    <div class="auth-section">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="emailInput" placeholder="officer@gem.gov.in">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="passwordInput" placeholder="••••••••">
      </div>
      <button class="btn-primary" id="loginBtn">🔐 Sign In</button>
    </div>
    <div class="tip">
      Sign in with your GeM-Intel credentials to<br>enable <strong>price audit</strong> and <strong>report saving</strong>.
    </div>
  </div>

  <!-- Logged In View -->
  <div id="loggedInView" style="display:none;">
    <div class="user-info">
      <div class="user-name" id="userName">—</div>
      <div class="user-email" id="userEmail">—</div>
      <div class="user-role" id="userRole">—</div>
    </div>

    <button class="btn-secondary" id="dashBtn">📊 Open Dashboard ↗</button>
    <button class="btn-secondary btn-danger" id="logoutBtn" style="margin-top:6px;">Sign Out</button>

    <div class="tip" style="margin-top:14px;">
      Visit any <strong>GeM product page</strong> to see the<br>🏛️ <strong>Audit Price</strong> button automatically.
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
