<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GeM-Intel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { width: 340px; background: #0f172a; color: #f8fafc; padding: 16px; }
    .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #334155; padding-bottom: 12px; margin-bottom: 14px; }
    .logo { font-weight: 700; font-size: 15px; color: #60a5fa; display: flex; align-items: center; gap: 6px; }
    .badge { font-size: 10px; background: #1e293b; color: #94a3b8; padding: 2px 6px; border-radius: 4px; border: 1px solid #475569; }

    .btn-primary { width: 100%; background: #2563eb; color: #fff; border: none; padding: 10px; border-radius: 6px; font-weight: 600; font-size: 13px; cursor: pointer; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { width: 100%; background: transparent; color: #94a3b8; border: 1px solid #334155; padding: 8px; border-radius: 6px; font-size: 11px; cursor: pointer; margin-top: 8px; }
    .btn-secondary:hover { background: #1e293b; color: #fff; }

    .tip { font-size: 11px; color: #64748b; text-align: center; margin-top: 12px; line-height: 1.5; }
    .tip strong { color: #94a3b8; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🏛️ GeM-Intel</div>
    <div class="badge">GFR 149</div>
  </div>

  <button class="btn-primary" id="dashBtn">📊 Open Dashboard ↗</button>

  <div class="tip" style="margin-top:14px;">
    Visit any <strong>GeM product page</strong> to see the<br>🏛️ <strong>Audit Price</strong> button automatically.
  </div>

  <script src="popup.js"></script>
</body>
</html>
