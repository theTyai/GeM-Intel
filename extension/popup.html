<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GeM-Intel Quick Price Audit</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { width: 340px; background: #0f172a; color: #f8fafc; padding: 16px; }
    .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #334155; padding-bottom: 12px; margin-bottom: 12px; }
    .logo { font-weight: 700; font-size: 15px; color: #60a5fa; display: flex; align-items: center; gap: 6px; }
    .badge { font-size: 10px; background: #1e293b; color: #94a3b8; padding: 2px 6px; border-radius: 4px; border: 1px solid #475569; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 4px; text-transform: uppercase; font-weight: 600; }
    input { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 12px; }
    input:focus { outline: none; border-color: #3b82f6; }
    .btn-audit { width: 100%; background: #2563eb; color: #fff; border: none; padding: 10px; border-radius: 6px; font-weight: 600; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-audit:hover { background: #1d4ed8; }
    .btn-dashboard { margin-top: 8px; width: 100%; background: transparent; color: #94a3b8; border: 1px solid #334155; padding: 7px; border-radius: 6px; font-size: 11px; cursor: pointer; }
    .btn-dashboard:hover { background: #1e293b; color: #fff; }
    .result-box { margin-top: 12px; background: #1e293b; border-radius: 6px; padding: 10px; border: 1px solid #334155; display: none; }
    .status-tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; margin-bottom: 6px; }
    .tag-compliant { background: #065f46; color: #6ee7b7; }
    .tag-review { background: #78350f; color: #fcd34d; }
    .tag-non-compliant { background: #7f1d1d; color: #fca5a5; }
    .result-row { display: flex; justify-content: space-between; font-size: 12px; margin-top: 4px; }
    .muted { color: #94a3b8; }
    .spinner { display: none; text-align: center; padding: 12px; font-size: 12px; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🏛️ GeM-Intel</div>
    <div class="badge">GFR 149</div>
  </div>

  <div class="form-group">
    <label>GeM Listing URL</label>
    <input type="text" id="gemUrlInput" placeholder="Auto-detected from active tab...">
  </div>

  <div class="form-group">
    <label>Delivery PIN Code</label>
    <input type="text" id="pinInput" value="110001">
  </div>

  <button class="btn-audit" id="auditBtn">⚡ Audit Market Price</button>
  <button class="btn-dashboard" id="dashBtn">Open Web Dashboard ↗</button>

  <div class="spinner" id="loadingSpinner">
    🔍 Scanning Amazon, Flipkart & IndiaMART...
  </div>

  <div class="result-box" id="resultBox">
    <div id="statusBadge" class="status-tag tag-review">REVIEW REQUIRED</div>
    <div class="result-row">
      <span class="muted">GeM Landed:</span>
      <strong id="gemPriceText">₹--</strong>
    </div>
    <div class="result-row">
      <span class="muted">Fair Market Value:</span>
      <strong id="fmvText">₹--</strong>
    </div>
    <div class="result-row">
      <span class="muted">Price Variance:</span>
      <strong id="varText">--%</strong>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
