version: '3.8'

services:
  # AI Engine (Python/FastAPI)
  ai-service:
    build: ./ai-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      # Provide your actual Gemini API Key here or in a .env file
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: unless-stopped

  # API Gateway (Node.js/Express)
  api-backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key}
      - AI_SERVICE_URL=http://ai-service:8000
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - NODE_ENV=production
    depends_on:
      - ai-service
    restart: unless-stopped

  # Frontend (React/Vite -> Nginx)
  frontend:
    build:
      context: ./frontend
      args:
        # Important: this tells the frontend how to reach the backend from the user's browser
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000/api/v1}
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - api-backend
    restart: unless-stopped
